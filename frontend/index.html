<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Sistema de Ventas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="saltar-contenido" href="#principal">Saltar al contenido</a>

  <!-- ui.js rellena el menú. En escritorio queda fijo; bajo 992 px es un offcanvas. -->
  <aside id="sidebar" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" aria-label="Menú principal"></aside>

  <div class="contenido">
    <header class="topbar">
      <button class="btn btn-light d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
              aria-controls="sidebar" aria-label="Abrir menú">
        <i class="bi bi-list fs-5" aria-hidden="true"></i>
      </button>
      <h1 class="h5 mb-0">Dashboard</h1>
    </header>

    <main id="principal" class="p-3 p-md-4" tabindex="-1">
      <section class="row g-3 mb-3" aria-label="Indicadores">
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="tarjeta kpi">
            <span class="kpi-icono"><i class="bi bi-people" aria-hidden="true"></i></span>
            <div>
              <p class="kpi-valor" id="kpi-clientes">—</p>
              <p class="kpi-etiqueta">Clientes</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="tarjeta kpi">
            <span class="kpi-icono"><i class="bi bi-box-seam" aria-hidden="true"></i></span>
            <div>
              <p class="kpi-valor" id="kpi-productos">—</p>
              <p class="kpi-etiqueta">Productos</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="tarjeta kpi">
            <span class="kpi-icono"><i class="bi bi-receipt" aria-hidden="true"></i></span>
            <div>
              <p class="kpi-valor" id="kpi-ventas">—</p>
              <p class="kpi-etiqueta">Ventas registradas</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="tarjeta kpi">
            <span class="kpi-icono"><i class="bi bi-cash-stack" aria-hidden="true"></i></span>
            <div>
              <p class="kpi-valor" id="kpi-ingresos">—</p>
              <p class="kpi-etiqueta">Ingresos acumulados</p>
            </div>
          </div>
        </div>
      </section>

      <div class="row g-3">
        <div class="col-12 col-xl-8">
          <section class="tarjeta h-100" aria-labelledby="titulo-grafico">
            <div class="tarjeta-encabezado">
              <h2 id="titulo-grafico">Ingresos por mes</h2>
              <span class="small text-secondary">Últimos 12 meses</span>
            </div>
            <div class="tarjeta-cuerpo">
              <div class="grafico-contenedor">
                <canvas id="grafico-ventas" role="img" aria-label="Gráfico de ingresos por mes"></canvas>
              </div>
            </div>
          </section>
        </div>

        <div class="col-12 col-xl-4">
          <section class="tarjeta h-100" aria-labelledby="titulo-stock">
            <div class="tarjeta-encabezado">
              <h2 id="titulo-stock"><i class="bi bi-exclamation-triangle text-warning me-1" aria-hidden="true"></i>Stock bajo</h2>
              <a class="small" href="productos.html">Ver productos</a>
            </div>
            <ul class="list-group list-group-flush" id="lista-stock-bajo">
              <li class="list-group-item text-secondary">Cargando…</li>
            </ul>
          </section>
        </div>

        <div class="col-12">
          <section class="tarjeta" aria-labelledby="titulo-ultimas">
            <div class="tarjeta-encabezado">
              <h2 id="titulo-ultimas">Últimas transacciones</h2>
              <a class="small" href="ventas.html">Ver historial</a>
            </div>
            <div class="table-responsive">
              <table class="table tabla">
                <thead>
                  <tr>
                    <th scope="col">Venta</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Cliente</th>
                    <th scope="col" class="numero d-none d-md-table-cell">Unidades</th>
                    <th scope="col" class="numero">Total</th>
                  </tr>
                </thead>
                <tbody id="tabla-ultimas">
                  <tr><td colspan="5" class="text-secondary">Cargando…</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
          integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
